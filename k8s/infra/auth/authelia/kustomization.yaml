apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authelia

configMapGenerator:
  - name: consent
    namespace: authelia
    files: [ ./locales/en/consent.json ]
  - name: email-templates
    namespace: authelia
    files:
      - email_templates/Event.html
      - email_templates/IdentityVerificationJWT.html
      - email_templates/IdentityVerificationOTC.html

resources:
  - ns.yaml
  - crypto.yaml
  - lldap-credentials.yaml
  - smtp-credentials.yaml
  - valkey-credentials.yaml
  - cert-rsa-jwk.yaml
  - cert-ecdsa-jwk.yaml
  - cert-valkey.yaml
  - http-route.yaml
  - cnpg-db.yaml
  - clients/argocd.yaml
  - clients/audiobookshelf.yaml
  - clients/grafana.yaml
  - clients/netbird.yaml
  - dashboard.yaml

helmCharts:
  - name: authelia
    repo: oci://ghcr.io/vehagn/chartrepo/
    releaseName: authelia
    namespace: authelia
    version: 0.11.7 # renovate: github-releases=authelia/chartrepo extractVersion=^authelia-(?<version>.+)$
    valuesFile: values.yaml

  - name: valkey
    repo: https://valkey.io/valkey-helm/
    releaseName: valkey
    namespace: authelia
    version: 0.11.0
    valuesFile: valkey-values.yaml
