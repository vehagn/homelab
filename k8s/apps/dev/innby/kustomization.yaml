apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: innby

resources:
  - ns.yaml
  - cnpg-db.yaml
  - innby-credentials.yaml
  - innby-games-credentials.yaml

helmCharts:
  - name: innby
    repo: oci://ghcr.io/vehagn/charts
    releaseName: innby
    namespace: innby
    version: 0.5.3 # renovate: github-releases=vehagn/innby extractVersion=^v(?<version>.+)$
    valuesFile: values.yaml
